lifecycleKtx = "2.8.7"
hiltNavigationCompose = "1.2.0"
hiltWork = "1.4.0"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
coil = "2.7.0"
room = "2.8.4"
paging = "3.3.6"
exifinterface = "1.4.2"

ksp = "2.3.9"
